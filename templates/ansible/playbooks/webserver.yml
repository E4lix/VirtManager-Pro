---
- name: Transformation Template - Déploiement Serveur Web Nginx
  hosts: all
  become: yes
  tasks:
    - name: Installation de Nginx
      apt:
        name:
          - nginx
          - ufw
        state: present
        update_cache: yes

    - name: Page d'accueil par défaut de la VM VirtManager
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>VM Déployée via VirtManager Pro</title>
            <style>
              body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
              .card { background: #1e293b; padding: 2rem 3rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
              h1 { color: #38bdf8; margin-bottom: 0.5rem; }
              p { color: #94a3b8; }
              .badge { background: #0284c7; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; font-weight: bold; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>🚀 VM VirtManager Pro</h1>
              <p>Cette machine virtuelle a été provisionnée automatiquement via Ansible & Packer.</p>
              <p><span class="badge">Nginx Web Server : Actif</span></p>
            </div>
          </body>
          </html>
        mode: '0644'

    - name: Démarrage et activation du service Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes
